
[ANALOG_INDICATOR_...]
INPUT=CPHYS_SCRIPT_0
NAME=ARROW_FUEL_PRES				; name of mesh to move
UPPER_BOUND=102.00				; maximum input value for arrow to move with
LOWER_BOUND=0					; minimum input value
START=0							; offset for starting point, degrees
RANGE=265						; full range of arrow to move to at the upper bound, degrees
SPEED_LAG=0.2					; lag for speed, adding inertia of movement

; ============================================================================
; Optional CSP Lua instruments
; ============================================================================
; All blocks below are disabled. Uncomment a complete block, set NAME to the
; gauge needle mesh and tune its bounds, angles and LUT to the physical dial.
; CPHYS_SCRIPT_n values are provided by data/script.lua and its subsystems.
;
; Temperature instruments
; -----------------------------------------------------------------------------
;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_1
;NAME=CYLINDER_HEAD_TEMP_NEEDLE
;UPPER_BOUND=180
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.2
;LUT=(0=0|80=-70|110=-125|150=-180)
; Direct engine temperature in degrees C. For an air-cooled car this is the
; better source for a cylinder-head-temperature style gauge. CPHYS_SCRIPT_0 is
; the displayed coolant/lagged head temperature used by the active gauge above.

;[ANALOG_INDICATOR_...]
;INPUT=OIL_TEMPERATURE
;NAME=OIL_TEMPERATURE_NEEDLE
;UPPER_BOUND=150
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.2
;LUT=(0=0|70=-65|100=-120|140=-180)
; Native Assetto Corsa oil temperature, if the car has a separate oil gauge.

; Lubrication instruments
; -----------------------------------------------------------------------------
;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_53
;NAME=OIL_PRESSURE_NEEDLE
;UPPER_BOUND=100
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.15
;LUT=(0=0|20=-55|40=-105|80=-180)
; Live oil pressure in PSI. Set bounds and LUT to oilOptimalPressurePsi and the
; dial fitted to the specific car.

;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_54
;NAME=OIL_LEVEL_NEEDLE
;UPPER_BOUND=20
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.5
;LUT=(0=0|10=-90|20=-180)
; Oil tank contents in litres. Set UPPER_BOUND and LUT to oilTankCapacityLitres.

;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_55
;NAME=OIL_LEVEL_FRACTION_NEEDLE
;UPPER_BOUND=1
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.5
;LUT=(0=0|0.5=-90|1=-180)
; Normalized oil-tank level from empty (0) to full (1).

;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_62
;NAME=OIL_PUMP_EFFICIENCY_NEEDLE
;UPPER_BOUND=1
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.3
;LUT=(0=0|0.5=-90|1=-180)
; Oil-pump efficiency. This suits a diagnostic gauge, not a normal period dash.

;[ANALOG_INDICATOR_...]
;INPUT=CPHYS_SCRIPT_60
;NAME=OIL_LEAK_RATE_NEEDLE
;UPPER_BOUND=30
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0.3
;LUT=(0=0|5=-65|15=-125|30=-180)
; Oil-leak rate in litres per minute. Use only for a dedicated diagnostic display.

