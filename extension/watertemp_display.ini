;NAME=FUEL_MIXTURE_SELECTOR
;UPPER_BOUND=3
;LOWER_BOUND=0
;START=0
;RANGE=-180
;SPEED_LAG=0
;LUT=(0=0|1=-60|2=-120|3=-180)
; CSP engine-map selection: 0=Rich, 1=Normal, 2=Lean, 3=Push.

; Status inputs for warning lamps, text displays or non-needle animations
; -----------------------------------------------------------------------------
; CPHYS_SCRIPT_11 = brake-fade fraction (0-1)
; CPHYS_SCRIPT_16 = one or more tyres punctured (0/1)
; CPHYS_SCRIPT_32 = overrev state (0=normal, 1=warning, 2=severe)
; CPHYS_SCRIPT_46 = alternator operating (0/1)
; CPHYS_SCRIPT_45 = remaining battery capacity in percent (0-100)
; CPHYS_SCRIPT_56 = manual oil pump currently active (0/1)
; CPHYS_SCRIPT_57 = oil-pressure damage active (0/1)
; CPHYS_SCRIPT_58 = oil service currently active (0/1)
; CPHYS_SCRIPT_59 = oil tank leaking (0/1)
; CPHYS_SCRIPT_61 = oil pump damaged (0/1)
; CPHYS_SCRIPT_63 = manual fuel pressurisation enabled (0/1)
; CPHYS_SCRIPT_65 = fuel pressure pump active (0/1)
; CPHYS_SCRIPT_66 = fuel pressure low (0/1)
; CPHYS_SCRIPT_67 = fuel pressure causing fuel cuts (0/1)
; CPHYS_SCRIPT_69 = fouled spark-plug count
; CPHYS_SCRIPT_70 = dead-cylinder count
; CPHYS_SCRIPT_73 = cooling-system type (1=radiator, 2=air)
; CPHYS_SCRIPT_74 = air-cooling state (0=OK, 1=slip, 2=broken, 3=fan/shroud)
; CPHYS_SCRIPT_78 = air-cooling repair active (0/1)
; CPHYS_SCRIPT_79 = air-cooling repair progress (0-1)
; CPHYS_SCRIPT_83 = PSG animState (float from neutral 0 -> [highest gear + 1])
; CPHYS_SCRIPT_84 = Air-cooling fan-drive type: `0=not air cooled`, `1=shared belt`, `2=separate belt`, `3=gear driven`, `4=direct driven`, `5=no mechanical fan`.
